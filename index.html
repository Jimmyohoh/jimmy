<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매장 통합 관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202b;--bg:#eef1f4;--ac:#0f766e;--warn:#c2410c}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
.in{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin-top:4px;background:#fff;font-size:15px}
.lb{display:block;font-size:13px;color:#475569;margin-bottom:10px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid var(--c,#cbd5e1);text-align:left;width:100%;display:block}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#e2e8f0}
.btn{background:var(--ac);color:#fff;border-radius:10px;padding:11px;font-weight:700;width:100%;margin-top:6px}
.btn.s{background:#e2e8f0;color:var(--ink)}.btn.d{background:#fee2e2;color:#b91c1c}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:50}
.pnl{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.fab{position:fixed;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 4px 14px #0004;z-index:20}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d5dbe1;display:flex;overflow:hidden;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1 1 0;min-width:0;padding:8px 0;font-size:10px;letter-spacing:-.4px;white-space:nowrap;color:#64748b}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:19px;line-height:1.25}
@media(max-width:340px){nav button{font-size:9px;letter-spacing:-.6px}}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;background:#dde3e8}.seg button.on{background:var(--ink);color:#fff}
table{border-collapse:collapse;font-size:12px}td,th{border:1px solid #e2e8f0;padding:5px 6px;text-align:center;white-space:nowrap}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;text-align:left}
.th{display:block;width:100%;max-width:100%;height:160px;object-fit:cover;border-radius:10px;background:#e2e8f0;cursor:zoom-in;margin-top:2px}
.throw{display:flex;flex-direction:column;gap:8px}
@media(min-width:640px){.throw{flex-direction:row}.throw>.th{width:180px;height:160px;flex:none}}
.btn[disabled]{opacity:.35}
#v{max-width:720px;margin:0 auto}
</style>
</head>
<body>
<header class="sticky top-0 z-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 py-3" style="padding-top:calc(.75rem + env(safe-area-inset-top))">
  <h1 id="ttl" class="font-bold text-lg"></h1>
  <div class="flex gap-2"><button onclick="pwForm()" class="chip">🔑 비밀번호</button><button id="adm" onclick="logout()" class="chip"></button></div>
</header>
<main id="v" class="p-3"></main>
<nav id="nav"></nav>
<div id="sh"></div>
<div id="lg"></div>
<div id="zoom"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 bg-slate-900 text-white text-sm px-4 py-2 rounded-full hidden z-[60]"></div>

    }
    else if (act === 'save') { const l = DB[p.sheet], i = l.findIndex(x => x.id == p.row.id); if (['Work', 'Lost', 'Meal'].includes(p.sheet)) p.row.createdAt = i < 0 ? nowStr() : l[i].createdAt; i < 0 ? l.push(p.row) : l[i] = p.row; r.row = p.row; }

function compress(file) {
  return new Promise(res => {
    const i = new Image();
    i.onerror = () => { toast('사진을 읽을 수 없습니다'); res(''); };
    i.onload = () => {
      const k = Math.min(1, 800 / i.width), c = document.createElement('canvas'); // 가로 최대 800px
      c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.4)); // 화질 40%
    };
    i.src = URL.createObjectURL(file);
  });
}

  if (sdate !== (H < 10 ? ymd(y) : ymd(n))) return -1;
  const h = H < 10 ? H + 24 : H;
  return h >= 10 && h <= 24 ? h - 10 : h === 25 && M < 30 ? 15 : -1;
}
function pickSlot(i) { selSlot = i; $('#sChart').innerHTML = salesChart(); }
function salesChart() {
  const v = salesVals(), total = v.reduce((a, b) => a + b, 0), max = Math.max(...v);
  const peak = max > 0 ? v.indexOf(max) : -1, sel = selSlot !== null ? selSlot : peak, now = curSlot();
  const raw = Math.max(max, 1) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(m => m * mag).find(x => x >= raw);
  const top = Math.ceil(Math.max(max, 1) / step) * step, n = Math.round(top / step);
  const grid = [...Array(n + 1)].map((_, t) => { const p = t * step / top * 100; return `<div style="position:absolute;left:0;right:0;bottom:${p}%;border-top:1px ${t ? 'dashed' : 'solid'} #dbe2ea"></div><span style="position:absolute;left:-36px;width:32px;text-align:right;bottom:calc(${p}% - 7px);font-size:10px;color:#94a3b8">${t ? fmtK(t * step) : 0}</span>`; }).join('');
  const cols = v.map((x, i) => `<button onclick="pickSlot(${i})" style="flex:1;min-width:0;height:100%;padding:0;border:0;border-radius:4px;display:flex;align-items:flex-end;background:${sel === i ? '#e8f0fe' : 'transparent'}"><div style="width:100%;height:${x / top * 100}%;min-height:${x ? 3 : 0}px;background:${i === peak ? '#f59e0b' : '#4285f4'};border-radius:3px 3px 0 0"></div></button>`).join('');
  const xl = XL.map((l, i) => `<span style="flex:1;min-width:0;text-align:center;font-size:9px;line-height:14px;border-radius:6px;${i === now ? 'background:#14202b;color:#fff;font-weight:700' : 'color:#64748b'}">${l}</span>`).join('');
  const info = sel >= 0 && total > 0
    ? `<b>${SLOTS[sel]}시</b> · <b style="font-size:16px">${won(v[sel])}</b> · 전체의 ${Math.round(v[sel] / total * 100)}%${sel === peak ? ' · <span style="color:#d97706">🔥 최고 매출</span>' : ''}`
    : '시간대별 매출을 입력하면 그래프가 나타납니다';
  const cnt = v.filter(x => x > 0).length;
  return `<div class="font-bold text-slate-500 mb-2">시간대 매출</div><div style="background:#f8fafc;border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:13px;min-height:36px">${info}</div><div style="position:relative;height:190px;margin-left:36px">${grid}<div style="position:absolute;inset:0;display:flex;gap:2px;align-items:stretch">${cols}</div></div><div style="display:flex;gap:2px;margin:6px 0 0 36px">${xl}</div><div style="margin:8px 0 0 36px;font-size:10px;color:#94a3b8">시 (24 = 자정, 25 = 새벽 1시) · 막대를 누르면 자세히 보입니다${now >= 0 ? ' · 검은 칸 = 지금' : ''}</div><div style="display:flex;gap:12px;margin:8px 0 0 36px;font-size:11px;color:#64748b"><span><i style="display:inline-block;width:9px;height:9px;background:#f59e0b;border-radius:2px"></i> 최고</span><span><i style="display:inline-block;width:9px;height:9px;background:#4285f4;border-radius:2px"></i> 일반</span>${cnt ? `<span>시간대 평균 ${won(total / cnt)}</span>` : ''}</div>`;
}
function sShift(d) { const x = new Date(sdate + 'T00:00'); x.setDate(x.getDate() + d); sdate = ymd(x); selSlot = null; render(); }
const WD = ['월', '화', '수', '목', '금', '토', '일'];
const mondayOf = ds => { const d = new Date(ds + 'T00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
const weekDates = () => { const m = mondayOf(sdate); return [...Array(7)].map((_, i) => { const x = new Date(m); x.setDate(x.getDate() + i); return ymd(x); }); };
const dayRow = ds => (D.Sales || []).find(x => x.date === ds);
const dayTotal = ds => { const r = dayRow(ds); return r ? salesCalc(r).total : 0; };
const hasDay = ds => { const r = dayRow(ds); return !!r && SLOTS.some((_, i) => r['s' + i] !== undefined && r['s' + i] !== ''); };
const niceScale = max => { const raw = Math.max(max, 1) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(m => m * mag).find(x => x >= raw), top = Math.ceil(Math.max(max, 1) / step) * step; return { step, top, n: Math.round(top / step) }; };
function wShift(d) { const x = new Date(sdate + 'T00:00'); x.setDate(x.getDate() + 7 * d); sdate = ymd(x); selSlot = null; render(); }
function pickDay(ds) { sdate = ds; selSlot = null; render(); }
function weekChart() { // 선택한 날짜가 속한 주(월~일)의 요일별 총매출
  const ds = weekDates(), v = ds.map(dayTotal), has = ds.map(hasDay), total = v.reduce((a, b) => a + b, 0), max = Math.max(...v);
  const peak = max > 0 ? v.indexOf(max) : -1, cnt = has.filter(Boolean).length, { step, top, n } = niceScale(max);
  const md = d => +d.slice(5, 7) + '/' + +d.slice(8);
  const grid = [...Array(n + 1)].map((_, t) => { const p = t * step / top * 100; return `<div style="position:absolute;left:0;right:0;bottom:${p}%;border-top:1px ${t ? 'dashed' : 'solid'} #dbe2ea"></div><span style="position:absolute;left:-36px;width:32px;text-align:right;bottom:calc(${p}% - 7px);font-size:10px;color:#94a3b8">${t ? fmtK(t * step) : 0}</span>`; }).join('');
  const cols = ds.map((d, i) => { const h = v[i] / top * 100; return `<button onclick="pickDay('${d}')" style="flex:1;min-width:0;height:100%;position:relative;padding:0;border:0;border-radius:6px;background:${d === sdate ? '#e8f0fe' : 'transparent'}"><div style="position:absolute;left:14%;right:14%;bottom:0;height:${h}%;min-height:${v[i] ? 3 : 0}px;background:${i === peak ? '#f59e0b' : '#4285f4'};border-radius:4px 4px 0 0"></div>${has[i] ? `<div style="position:absolute;left:-4px;right:-4px;bottom:calc(${h}% + 3px);font-size:10px;font-weight:700;color:#334155;text-align:center">${fmtK(v[i])}</div>` : ''}</button>`; }).join('');
  const xl = ds.map((d, i) => `<div style="flex:1;min-width:0;text-align:center;line-height:15px"><div style="font-size:12px;font-weight:700;color:${i === 5 ? '#2563eb' : i === 6 ? '#dc2626' : '#334155'}">${WD[i]}</div><div style="font-size:10px;border-radius:6px;${d === today ? 'background:#14202b;color:#fff' : 'color:#94a3b8'}">${md(d)}</div></div>`).join('');
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><button class="chip" style="padding:6px 12px" onclick="wShift(-1)">◀</button><b>요일별 매출 <span style="font-weight:400;font-size:12px;color:#64748b">${md(ds[0])} ~ ${md(ds[6])}</span></b><button class="chip" style="padding:6px 12px" onclick="wShift(1)">▶</button></div><div style="font-size:13px;margin-bottom:12px;color:#334155">${cnt ? `주간 합계 <b>${won(total)}</b> · 하루 평균 ${won(total / cnt)} · 최고 <b style="color:#d97706">${WD[peak]}요일</b>` : '이 주에 입력된 매출이 없습니다'}</div><div style="position:relative;height:160px;margin:14px 0 0 36px">${grid}<div style="position:absolute;inset:0;display:flex;gap:4px">${cols}</div></div><div style="display:flex;gap:4px;margin:6px 0 0 36px">${xl}</div><div style="margin:8px 0 0 36px;font-size:10px;color:#94a3b8">막대를 누르면 그날의 시간대별 매출이 아래에 나옵니다 (파란 배경 = 선택한 날)</div>`;
}
async function setSales(i, v) {
  const amount = String(v).trim() === '' ? '' : Math.max(0, Math.round(+v || 0)); // 비우면 미입력
  const r = await api('sales', { date: sdate, idx: i, amount });
  if (!r.ok) { toast(r.error || '저장 실패'); return render(); }
  const l = (D.Sales = D.Sales || []), k = l.findIndex(x => x.id == r.row.id); k < 0 ? l.push(r.row) : l[k] = r.row;
  refreshSales();
  if (salesCalc().rows.some(x => x.real !== null && x.real < 0)) toast('누적 매출이 앞 시간대보다 작은 칸이 있습니다. 확인해 주세요');
}
V.sales = () => { const c = salesCalc(); return `<div class="card" id="wChart" style="--c:#f59e0b">${weekChart()}</div><div class="flex justify-between items-center mb-3"><button class="chip" style="padding:8px 14px" onclick="sShift(-1)">◀</button><input type="date" class="in" style="width:auto;margin:0" value="${sdate}" onchange="sdate=this.value||today;selSlot=null;render()"><button class="chip" style="padding:8px 14px" onclick="sShift(1)">▶</button></div><div class="card" style="--c:#4285f4" id="sSum">${salesSummary()}</div><p class="text-xs text-slate-500 mb-2">누적 매출을 입력하면 옆 칸에 그 시간대의 실매출이 자동 계산됩니다. (실매출 = 이번 누적 − 직전 입력 누적)</p><div class="bg-white rounded-xl overflow-hidden mb-3"><table class="w-full"><tr><th style="text-align:center">시간대</th><th style="text-align:center">누적 매출(입력)</th><th style="text-align:center">실매출(자동)</th></tr>${SLOTS.map((l, i) => `<tr><td style="text-align:center">${l}</td><td style="padding:2px 6px"><input type="number" inputmode="numeric" min="0" class="in" placeholder="누적" style="margin:0;text-align:right;padding:6px 8px" value="${salesRow()['s' + i] ?? ''}" onchange="setSales(${i},this.value)"></td><td id="rs${i}" style="text-align:right;padding:2px 10px">${realCell(c.rows[i])}</td></tr>`).join('')}</table></div><div class="card" id="sChart">${salesChart()}</div>`; };
let mdate = today;
const weekOf = ds => { const m = mondayOf(ds); return [...Array(7)].map((_, i) => { const x = new Date(m); x.setDate(x.getDate() + i); return ymd(x); }); };
const ratingOf = id => { const l = (D.Rating || []).filter(r => r.postId === id), n = l.length; return { n, avg: n ? l.reduce((a, r) => a + +r.stars, 0) / n : 0 }; };
const myRating = id => { const r = (D.Rating || []).find(r => r.postId === id && r.user === U.username); return r ? +r.stars : 0; };
const starsHtml = (v, sz = 16) => [1, 2, 3, 4, 5].map(i => `<span style="color:${i <= Math.round(v) ? '#f59e0b' : '#d1d5db'};font-size:${sz}px">★</span>`).join('');
function ratingBlock(id) {
  const st = ratingOf(id), mine = myRating(id);
  return `<div style="background:#f8fafc;border-radius:10px;padding:10px;margin:8px 0"><div>${starsHtml(st.avg, 20)} <b>${st.n ? st.avg.toFixed(1) : '-'}</b> <span class="text-xs text-slate-500">(${st.n}명 평가)</span></div><div class="text-xs text-slate-500 mt-2">내 평점 · 별을 눌러 선택 (같은 별을 다시 누르면 취소)</div><div style="display:flex;gap:6px;margin-top:2px">${[1, 2, 3, 4, 5].map(i => `<button onclick="rate('${id}',${i})" style="font-size:32px;line-height:1;padding:2px;color:${i <= mine ? '#f59e0b' : '#d1d5db'}">★</button>`).join('')}</div></div>`;
}
async function rate(pid, n) {
  if (myRating(pid) === n) n = 0;
  const r = await api('rate', { postId: pid, stars: n });
  if (!r.ok) return toast(r.error || '평점 저장 실패');
  D.Rating = (D.Rating || []).filter(x => !(x.postId === pid && x.user === U.username));
  if (n && r.row) D.Rating.push(r.row);
  const p = $('#sh .pnl'), top = p ? p.scrollTop : 0;
  render(); showDetail('Meal', pid); const q = $('#sh .pnl'); if (q) q.scrollTop = top;
}
function mShift(d) { const x = new Date(mdate + 'T00:00'); x.setDate(x.getDate() + 7 * d); mdate = ymd(x); render(); }
function mealWeek() { // 월~일 7칸을 가로로 나란히
  const ds = weekOf(mdate), md = d => +d.slice(5, 7) + '/' + +d.slice(8);
  const cols = ds.map((d, i) => {
    const ms = D.Meal.filter(m => m.date === d);
    const items = ms.length ? ms.map(m => { const st = ratingOf(m.id); return `<button onclick="showDetail('Meal','${m.id}')" style="display:block;width:100%;background:#dbeafe;border-radius:8px;padding:6px 0;margin-bottom:3px;font-size:10.5px;letter-spacing:-.3px;line-height:1.3;text-align:center;overflow-wrap:anywhere;text-wrap:balance">${esc(m.menu)}${st.n ? `<div style="color:#d97706;font-size:10px">★${st.avg.toFixed(1)}</div>` : ''}</button>`; }).join('') : `<div style="color:#cbd5e1;text-align:center;line-height:22px">-</div>`;
    return `<div style="flex:1;min-width:0;border-radius:8px;padding:6px 1px;${d === today ? 'background:#f0fdfa;box-shadow:inset 0 0 0 1.5px #0f766e' : ''}"><div style="text-align:center;line-height:16px;margin-bottom:5px"><div style="font-weight:700;color:${i === 5 ? '#2563eb' : i === 6 ? '#dc2626' : '#334155'}">${WD[i]}</div><div style="font-size:10px;color:#94a3b8">${md(d)}</div></div>${items}</div>`;
  }).join('');
  return `<div class="card" style="--c:#0f766e"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="chip" style="padding:6px 12px" onclick="mShift(-1)">◀</button><b>${ds.includes(today) ? '이번 주' : '주간'} 직원식 <span style="font-weight:400;font-size:12px;color:#64748b">${md(ds[0])} ~ ${md(ds[6])}</span></b><button class="chip" style="padding:6px 12px" onclick="mShift(1)">▶</button></div><div style="display:flex;gap:2px">${cols}</div></div>`;
}
function cycle(id) { const r = D.Work.find(x => x.id == id), o = ['미완료', '공유', '완료']; save('Work', { ...r, status: o[(o.indexOf(r.status) + 1) % 3] }); }
function toggleLost(id) { const r = D.Lost.find(x => x.id == id); save('Lost', { ...r, returned: r.returned ? '' : 'Y' }); }
function editShift(sid, date) { const name = D.Staff.find(x => x.id == sid).name; const r = D.Schedule.find(s => s.name === name && s.date === date) || { name, date }; showForm('Schedule', F.Schedule, r, `${name} · ${date}`); }
function dayView(ds) {
  const rs = D.Reservation.filter(r => r.date === ds);
  sheetUI(`<h3 class="font-bold mb-3">${ds} (${DOW[new Date(ds + 'T00:00').getDay()]})</h3>${rs.map(r => `<div class="card" style="--c:var(--ac)" onclick="openF('Reservation','${r.id}')">${esc(r.content)}</div>`).join('') || '<p class="text-slate-500 mb-3">예약이 없습니다</p>'}<button class="btn" onclick="showForm('Reservation',F.Reservation,{date:'${ds}'},'예약 등록')">+ 예약 추가</button><button class="btn s" onclick="closeSh()">닫기</button>`);
}

/* ===== 라우팅 ===== */
const T = [['manual', '📖', '매뉴얼'], ['work', '📢', '업무공유'], ['sched', '📅', '스케줄'], ['sales', '💰', '매출'], ['resv', '🗓️', '예약'], ['disc', '💳', '할인'], ['lost', '📦', '분실물'], ['meal', '🍱', '직원식']];
function render() {
  $('#nav').innerHTML = T.map(([k, i, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="tab='${k}';render();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join('');
  $('#ttl').textContent = T.find(t => t[0] === tab)[2];
  $('#adm').textContent = (admin ? '관리자 ' : '') + U.name + ' · 로그아웃';
  $('#v').innerHTML = V[tab]();

U ? startApp() : showLogin();
</script>
