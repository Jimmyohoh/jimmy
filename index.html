<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매장 통합 관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202b;--bg:#eef1f4;--ac:#0f766e;--warn:#c2410c}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
.in{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin-top:4px;background:#fff;font-size:15px}
.lb{display:block;font-size:13px;color:#475569;margin-bottom:10px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid var(--c,#cbd5e1);text-align:left;width:100%;display:block;cursor:pointer}
.card:active{transform:scale(0.99)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#e2e8f0}
.btn{background:var(--ac);color:#fff;border-radius:10px;padding:11px;font-weight:700;width:100%;margin-top:6px}
.btn.s{background:#e2e8f0;color:var(--ink)}.btn.d{background:#fee2e2;color:#b91c1c}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:50}
.pnl{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.fab{position:fixed;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 4px 14px #0004;z-index:20;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d5dbe1;display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1 0 auto;min-width:62px;padding:8px 4px;font-size:11px;color:#64748b;background:none;border:none;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;background:#dde3e8;border:none}
.seg button.on{background:var(--ink);color:#fff}
table{border-collapse:collapse;font-size:12px;width:100%}td,th{border:1px solid #e2e8f0;padding:5px 6px;text-align:center;white-space:nowrap}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;text-align:left}
.th{display:block;width:100%;max-width:100%;height:160px;object-fit:cover;border-radius:10px;background:#e2e8f0;cursor:zoom-in;margin-top:2px}
.throw{display:flex;flex-direction:column;gap:8px}
@media(min-width:640px){.throw{flex-direction:row}.throw>.th{width:180px;height:160px;flex:none}}
.btn[disabled]{opacity:.35}
#v{max-width:720px;margin:0 auto}

/* 댓글 및 모달 세부 스타일 */
.comment-section{margin-top:20px;border-top:1px solid #eee;padding-top:15px}
.comment-item{background:#f8f9fa;padding:10px;border-radius:8px;margin-bottom:8px;font-size:0.88rem}
.comment-author{font-weight:bold;font-size:0.8rem;color:#444}
.comment-date{font-size:0.72rem;color:#999;margin-left:5px}
.comment-input-box{display:flex;gap:8px;margin-top:10px}
.comment-input-box input{flex:1;padding:10px;border:1px solid #ddd;border-radius:6px}
.comment-input-box button{padding:10px 16px;background:var(--ac);color:#fff;border:none;border-radius:6px}
</style>
</head>
<body>
<header class="sticky top-0 z-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 py-3" style="padding-top:calc(.75rem + env(safe-area-inset-top))">
  <h1 id="ttl" class="font-bold text-lg">매장 통합 관리</h1>
  <button id="adm" onclick="logout()" class="chip">로그인</button>
</header>

<main id="v" class="p-3">
  <!-- 메인 콘텐츠 영역 -->
</main>
<nav id="nav">
  <!-- 하단 탭 내비게이션 영역 -->
</nav>
<div id="sh"></div>
<div id="lg"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 bg-slate-900 text-white text-sm px-4 py-2 rounded-full hidden z-[60]"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyjwMkZA5-e-DpdY9BOTEwAm32NACywkr8KPhjla0xjpF6Kn-JU0klDaLsVXB8e7LX1/exec';

// ⚡ [핵심] 이미지 강렬 압축 함수 (Canvas API 활용, 가로 최대 800px, 화질 40%)
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      const max_size = 800;

      if (width > height) {
        if (width > max_size) { height *= max_size / width; width = max_size; }
      } else {
        if (height > max_size) { width *= max_size / height; height = max_size; }
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.4);
      callback(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

window.onload = function() {
  console.log("매장 통합 관리 시스템 로드 완료");
  // 필요한 초기화 및 렌더링 함수 호출부
};
</script>
</body>
</html>
