<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>업무공유</title>
  <style>
    :root {
      --primary-color: #007a5a;
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color); color: var(--text-color);
    }
    header {
      background: #fff; padding: 15px 20px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid #e1e4e8; sticky: top;
    }
    h1 { margin: 0; font-size: 1.2rem; }
    .container { padding: 15px; max-width: 600px; margin: 0 auto; }
    
    /* 게시글 카드 스타일 */
    .post-card {
      background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.1s;
    }
    .post-card:active { transform: scale(0.99); }
    .post-meta { font-size: 0.82rem; color: #777; margin-bottom: 6px; }
    .post-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 6px; }
    .post-snippet { font-size: 0.9rem; color: #555; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem;
      background: #e8f5e9; color: var(--primary-color); font-weight: bold; margin-left: 6px;
    }

    /* 상세 모달 팝업 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: flex-end;
      z-index: 1000;
    }
    .modal-content {
      background: #fff; width: 100%; max-width: 600px; border-radius: 16px 16px 0 0;
      max-height: 85vh; overflow-y: auto; padding: 20px; box-sizing: border-box; animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #888; }
    .modal-img { width: 100%; border-radius: 8px; margin: 12px 0; object-fit: cover; }

    /* 댓글 섹션 */
    .comment-section { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    .comment-item { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.88rem; }
    .comment-author { font-weight: bold; font-size: 0.8rem; color: #444; }
    .comment-date { font-size: 0.72rem; color: #999; margin-left: 5px; }
    .comment-input-box { display: flex; gap: 8px; margin-top: 10px; }
    .comment-input-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .comment-input-box button { padding: 10px 16px; background: var(--primary-color); color: #fff; border: none; border-radius: 6px; }

    /* 작성 버튼 (FAB) */
    .fab {
      position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
      border-radius: 28px; background: var(--primary-color); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: none; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>업무공유</h1>
    <span id="userInfo" style="font-size:0.85rem; color:#666;">점장</span>
  </header>

  <div class="container" id="postList">
    <!-- 게시글 목록이 로딩됩니다 -->
  </div>

  <!-- 상세 보기 팝업 (모달) -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="post-meta" id="modalMeta"></span>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <h2 id="modalTitle" style="margin:0 0 10px 0; font-size:1.2rem;"></h2>
      <div id="modalContent" style="white-space: pre-line; line-height:1.5;"></div>
      <div id="modalImageContainer"></div>

      <!-- 댓글 영역 -->
      <div class="comment-section">
        <h4 style="margin:0 0 10px 0;">댓글</h4>
        <div id="commentList"></div>
        <div class="comment-input-box">
          <input type="text" id="commentInput" placeholder="댓글을 입력하세요...">
          <button onclick="submitComment()">등록</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzZRy4B6_6Cnlm7X1oWqFJQ3A6ucfDfDrA_5ltnYu0KByOp9KnzoCRQnxBRsMJkW5lA/exec"; // 백엔드 배포 URL
    let postsData = [];
    let commentsData = [];
    let currentPostId = null;

    // 페이지 로드 시 초기 데이터 불러오기
    window.onload = function() {
      loadData();
    };

    function loadData() {
      fetch(GAS_URL + '?action=getInitialData')
        .then(res => res.json())
        .then(data => {
          postsData = data.posts || [];
          commentsData = data.comments || [];
          renderPosts();
        })
        .catch(err => console.error(err));
    }

    // 게시글 리스트 출력 (사진은 제외하여 속도 극대화)
    function renderPosts() {
      const container = document.getElementById('postList');
      container.innerHTML = '';

      postsData.forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.onclick = () => openDetail(post.id);

        card.innerHTML = `
          <div class="post-meta">${post.createdAt} · ${post.author} <span class="badge">${post.status || '미완료'}</span></div>
          <div class="post-title">${post.category ? '[' + post.category + '] ' : ''}${post.title || '업무 내용'}</div>
          <div class="post-snippet">${post.content}</div>
        `;
        container.appendChild(card);
      });
    }

    // 팝업 열기 (사진 & 댓글 로드)
    function openDetail(postId) {
      currentPostId = postId;
      const post = postsData.find(p => p.id === postId);
      if (!post) return;

      document.getElementById('modalMeta').innerText = `${post.createdAt} · ${post.author}`;
      document.getElementById('modalTitle').innerText = post.title || '업무 내용';
      document.getElementById('modalContent').innerText = post.content;

      const imgContainer = document.getElementById('modalImageContainer');
      imgContainer.innerHTML = '';
      if (post.imageUrl) {
        imgContainer.innerHTML = `<img src="${post.imageUrl}" class="modal-img" alt="첨부사진">`;
      }

      renderComments(postId);
      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
      currentPostId = null;
    }

    // 댓글 목록 렌더링
    function renderComments(postId) {
      const listEl = document.getElementById('commentList');
      listEl.innerHTML = '';
      const filtered = commentsData.filter(c => c.postId === postId);

      if (filtered.length === 0) {
        listEl.innerHTML = '<div style="color:#999; font-size:0.85rem;">첫 댓글을 남겨보세요.</div>';
        return;
      }

      filtered.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div><span class="comment-author">${c.author}</span><span class="comment-date">${c.createdAt}</span></div>
          <div style="margin-top:4px;">${c.content}</div>
        `;
        listEl.appendChild(item);
      });
    }

    // 댓글 제출
    function submitComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text || !currentPostId) return;

      const newComment = {
        postId: currentPostId,
        author: '점장', // 로그인 사용자명 연동 가능
        content: text
      };

      // 화면에 즉시 반영
      const tempId = 'temp_' + Date.now();
      const nowStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      commentsData.push({ ...newComment, id: tempId, createdAt: '방금 전' });
      renderComments(currentPostId);
      input.value = '';

      // 백엔드 전송
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'addComment', data: newComment })
      });
    }

    // ⚡ [핵심] 이미지 강렬 압축 함수 (Canvas API 활용)
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const max_size = 800; // 최대 가로/세로 800px 제한

          if (width > height) {
            if (width > max_size) {
              height *= max_size / width;
              width = max_size;
            }
          } else {
            if (height > max_size) {
              width *= max_size / height;
              height = max_size;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 화질 0.4 (40%)로 강하게 압축하여 수십 KB 이하로 경량화
          const dataUrl = canvas.toDataURL('image/jpeg', 0.4);
          callback(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
