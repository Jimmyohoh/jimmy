<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매장 통합 관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202b;--bg:#eef1f4;--ac:#0f766e;--warn:#c2410c}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
.in{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin-top:4px;background:#fff;font-size:15px}
.lb{display:block;font-size:13px;color:#475569;margin-bottom:10px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid var(--c,#cbd5e1);text-align:left;width:100%;display:block}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#e2e8f0}
.btn{background:var(--ac);color:#fff;border-radius:10px;padding:11px;font-weight:700;width:100%;margin-top:6px}
.btn.s{background:#e2e8f0;color:var(--ink)}.btn.d{background:#fee2e2;color:#b91c1c}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:50}
.pnl{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.fab{position:fixed;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 4px 14px #0004;z-index:20}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d5dbe1;display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1 0 auto;min-width:62px;padding:8px 4px;font-size:11px;color:#64748b}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;background:#dde3e8}.seg button.on{background:var(--ink);color:#fff}
table{border-collapse:collapse;font-size:12px}td,th{border:1px solid #e2e8f0;padding:5px 6px;text-align:center;white-space:nowrap}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;text-align:left}
</style>
</head>
<body>
<header class="sticky top-0 z-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 py-3" style="padding-top:calc(.75rem + env(safe-area-inset-top))">
  <h1 id="ttl" class="font-bold text-lg"></h1>
  <button id="adm" onclick="logout()" class="chip"></button>
</header>
<main id="v" class="p-3"></main>
<nav id="nav"></nav>
<div id="sh"></div>
<div id="lg"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 bg-slate-900 text-white text-sm px-4 py-2 rounded-full hidden z-[60]"></div>

<script>
/* ===== 설정: 배포한 Apps Script 웹 앱 URL을 넣으세요. 비워두면 브라우저 저장소 기반 데모 모드(아이디 admin / 비밀번호 1234) ===== */
const API = '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = ymd(new Date());
const DOW = ['일','월','화','수','목','금','토'];
const MC = ['조리','CS','마감','POS','기타'];
const ADM = new Set(['Manual','Staff','Schedule','Category']);
const F = {
  Work:[['date','날짜','date'],['cat','항목','select',['시설','CS','운영','재고','공지사항']],['author','작성자','text'],['content','내용','textarea'],['image','사진','file'],['status','구분','select',['미완료','공유','완료']],['note','비고','text']],
  Meal:[['date','날짜','date'],['menu','메뉴','text'],['owner','담당자','text'],['note','비고','text'],['image','사진','file']],
  Lost:[['date','날짜','date'],['author','작성자','text'],['content','내용','textarea'],['image','사진','file']],
  Discount:[['date','날짜','date'],['name','이름','text'],['dept','부서','text'],['amount','할인 금액(원)','number'],['note','비고','text']],
  Manual:[['cat','카테고리','select',() => catList()],['title','제목','text'],['content','내용','textarea'],['image','사진','file']],
  Staff:[['role','직책','select',['점장','매니저','알바']],['name','이름','text'],['position','포지션','text'],['daeHyu','대휴 잔여(일)','number'],['daeHyuUsed','대휴 사용 날짜','date'],['hcIssue','보건증 발급일','date'],['hcExpire','보건증 만료일','date']],
  Schedule:[['start','출근','time'],['end','퇴근','time']],
  Reservation:[['date','날짜','date'],['content','예약 내용','text']]
};

let D = {}, tab = 'work', U = JSON.parse(localStorage.user || 'null'), admin = false, me = '';
let mcat = '전체', smode = 'me', wk = 0, cal = new Date(); cal.setDate(1);

/* ===== 데이터 계층 (GAS 또는 데모) ===== */
let DB = JSON.parse(localStorage.demo || 'null');
function seed() {
  const mon = monday(0), d = i => { const x = new Date(mon); x.setDate(x.getDate()+i); return ymd(x); };
  const exp = new Date(); exp.setDate(exp.getDate()+12);
  return {
    Manual:[{id:'m1',cat:'마감',title:'마감 체크리스트',content:'1. 주방 청소\n2. 재고 확인\n3. 포스 정산',image:''}],
    Work:[{id:'w1',date:today,cat:'공지사항',author:'점장',content:'이번 주 금요일 위생 점검이 있습니다.',status:'공유',note:''},{id:'w2',date:today,cat:'시설',author:'민수',content:'냉장고 2번 소음 발생',status:'미완료',note:'기사 방문 요청'}],
    Staff:[{id:'s1',role:'알바',name:'민수',position:'홀',daeHyu:'1',daeHyuUsed:'',hcIssue:'2025-10-30',hcExpire:ymd(exp)},{id:'s2',role:'매니저',name:'지연',position:'주방',daeHyu:'0',daeHyuUsed:'',hcIssue:'',hcExpire:''}],
    Schedule:[{id:'c1',date:d(0),name:'민수',start:'09:00',end:'18:00'},{id:'c2',date:d(2),name:'민수',start:'12:00',end:'21:00'},{id:'c3',date:d(0),name:'지연',start:'08:00',end:'17:00'}],
    Meal:[{id:'e1',date:today,menu:'김치볶음밥',owner:'지연',note:''}],
    Lost:[{id:'l1',date:today,author:'민수',content:'검은색 우산',returned:''}],
    Discount:[{id:'d1',date:today,name:'민수',dept:'직원',amount:'3000',note:''}],
    Reservation:[{id:'r1',date:today,content:'회장님 외 18명'}]
  };
}
async function api(act, p = {}) {
  if (!API) {
    DB = DB || seed();
    if (!DB.Category) DB.Category = MC.map((n, i) => ({ id: 'c' + i, name: n }));
    let r = { ok: true };
    if (act === 'all') r = DB;
    else if (act === 'login') { const u = { admin: { pw: '1234', name: '지연', role: 'admin' }, staff: { pw: '1234', name: '민수', role: 'staff' } }[p.username]; r = u && u.pw === p.password ? { ok: true, token: 'demo', user: { username: p.username, name: u.name, role: u.role } } : { ok: false, error: '아이디 또는 비밀번호가 틀립니다' }; }
    else if (act === 'user') r = { ok: true };
    else if (act === 'save') { const l = DB[p.sheet], i = l.findIndex(x => x.id == p.row.id); i < 0 ? l.push(p.row) : l[i] = p.row; r.row = p.row; }
    else if (act === 'del') DB[p.sheet] = DB[p.sheet].filter(x => x.id != p.id);
    localStorage.demo = JSON.stringify(DB);
    return JSON.parse(JSON.stringify(r));
  }
  try {
    const r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: act, token: localStorage.token || '', ...p }) })).json();
    if (r.auth === false) logout('로그인이 만료되었습니다. 다시 로그인하세요.');
    return r;
  } catch (e) { return { ok: false, error: '네트워크 오류' }; }
}
async function save(s, row) {
  row.id = row.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const r = await api('save', { sheet: s, row });
  if (!r.ok) return toast(r.error || '저장 실패');
  const l = D[s], i = l.findIndex(x => x.id == r.row.id); i < 0 ? l.push(r.row) : l[i] = r.row;
  closeSh(); render(); toast('저장했습니다');
}
const catList = () => { const l = (D.Category || []).map(c => c.name); return l.length ? l : MC; };
function setCat(i) { mcat = ['전체', ...catList()][i] || '전체'; render(); }
function catMgr() {
  const l = D.Category || [];
  sheetUI(`<h3 class="font-bold mb-3">카테고리 관리</h3>${l.map(c => `<div class="card flex items-center justify-between" style="--c:var(--ac)"><span>${esc(c.name)} <span class="text-xs text-slate-500">(글 ${D.Manual.filter(m => m.cat === c.name).length}개)</span></span><button class="chip" style="background:#fee2e2;color:#b91c1c;padding:6px 12px" onclick="delCat('${c.id}')">삭제</button></div>`).join('') || '<p class="text-slate-500 mb-3">카테고리가 없습니다</p>'}<label class="lb mt-3">새 카테고리 이름<input id="cn" class="in" maxlength="20"></label><button class="btn" onclick="addCat()">추가</button><button class="btn s" onclick="closeSh()">닫기</button>`);
}
async function addCat() {
  const name = $('#cn').value.trim();
  if (!name) return toast('이름을 입력하세요');
  if (catList().includes(name)) return toast('이미 있는 카테고리입니다');
  if (!(D.Category || []).length) D.Category = MC.map((n, i) => ({ id: 'c' + i, name: n }));
  await save('Category', { name });
  catMgr();
}
async function delCat(id) {
  const c = D.Category.find(x => x.id == id), used = D.Manual.filter(m => m.cat === c.name).length;
  if (used) return toast(`'${c.name}' 글이 ${used}개 있어 삭제할 수 없습니다. 글의 카테고리를 먼저 바꾸세요.`);
  await doDel('Category', id);
  if (mcat === c.name) mcat = '전체';
  render(); catMgr();
}
function del(s, id) {
  sheetUI(`<h3 class="font-bold mb-1">이 글을 삭제할까요?</h3><p class="text-sm text-slate-500 mb-3">삭제하면 되돌릴 수 없습니다.</p><button class="btn d" onclick="doDel('${s}','${id}')">삭제</button><button class="btn s" onclick="closeSh()">취소</button>`);
}
async function doDel(s, id) {
  const r = await api('del', { sheet: s, id });
  if (!r.ok) return toast(r.error || '삭제 실패');
  D[s] = D[s].filter(x => x.id != id); closeSh(); render(); toast('삭제했습니다');
}

/* ===== UI 도우미 ===== */
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hidden'), 3500); }
function sheetUI(h) { $('#sh').innerHTML = `<div class="ov" onclick="closeSh()"><div class="pnl" onclick="event.stopPropagation()">${h}</div></div>`; }
function closeSh() { $('#sh').innerHTML = ''; }
const canEdit = s => !ADM.has(s) || admin;
const OWN = { Work: 'author', Lost: 'author', Meal: 'owner' };
const canDel = (s, r) => admin || (OWN[s] && r[OWN[s]] === me);
function compress(file) {
  return new Promise(res => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'), k = Math.min(1, 900 / i.width); c.width = i.width * k; c.height = i.height * k; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .75)); }; i.src = URL.createObjectURL(file); });
}
function showForm(s, fields, row, title, seedRow) {
  const inputs = fields.map(([k, l, t, o]) => {
    const v = esc(row[k] ?? (t === 'date' && k === 'date' ? today : ''));
    let inp;
    if (t === 'textarea') inp = `<textarea name="${k}" rows="4" class="in">${v}</textarea>`;
    else if (t === 'select') inp = `<select name="${k}" class="in">${(typeof o === 'function' ? o() : o).map(x => `<option ${x == row[k] ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
    else if (t === 'file') inp = `<input type="file" accept="image/*" name="${k}" class="in">${row[k] ? '<div class="text-xs text-slate-500">새 사진을 고르면 교체됩니다</div>' : ''}`;
    else inp = `<input type="${t}" name="${k}" value="${v}" class="in">`;
    return `<label class="lb">${l}${inp}</label>`;
  }).join('');
  sheetUI(`<h3 class="font-bold mb-3">${title}</h3>${inputs}<button class="btn" id="sv">저장</button>${row.id && canDel(s, row) ? `<button class="btn d" onclick="del('${s}','${row.id}')">삭제</button>` : ''}<button class="btn s" onclick="closeSh()">닫기</button>`);
  $('#sv').onclick = async () => {
    const out = { ...row, ...(seedRow || {}) };
    for (const [k, , t] of fields) {
      const el = $('#sh').querySelector(`[name="${k}"]`);
      if (t === 'file') { if (el.files[0]) out[k] = await compress(el.files[0]); }
      else out[k] = el.value;
    }
    save(s, out);
  };
}
function openF(s, id, def = {}) {
  if (!canEdit(s)) return toast('관리자 전용입니다');
  const row = id ? D[s].find(x => x.id == id) : { ...(F[s].some(f => f[0] === 'author') ? { author: me } : {}), ...def };
  showForm(s, F[s], row, id ? '수정' : '새로 등록');
}
const fab = (s, def) => canEdit(s) ? `<button class="fab" onclick="openF('${s}',null)">+</button>` : '';
const byDate = (a, b) => (b.date || '').localeCompare(a.date || '');
const thumbUrl = u => String(u).replace('sz=w1000', 'sz=w300');
const thumb = (s, r) => r.image ? `<img src="${esc(thumbUrl(r.image))}" alt="첨부 사진" class="w-16 h-16 object-cover rounded-lg flex-none bg-slate-100" onclick="event.stopPropagation();showImg('${s}','${r.id}')">` : '';
function showImg(s, id) { const r = D[s].find(x => x.id == id); sheetUI(`<img src="${esc(r.image)}" class="w-full rounded-lg"><button class="btn s mt-3" onclick="closeSh()">닫기</button>`); }
const empty = t => `<p class="text-center text-slate-500 py-10">${t}</p>`;

/* ===== 로그인 ===== */
function showLogin(msg) {
  $('#v').innerHTML = '';
  $('#lg').innerHTML = `<div class="fixed inset-0 z-[80] flex items-center justify-center p-6" style="background:var(--bg)"><div class="w-full max-w-sm"><h1 class="text-2xl font-bold mb-1">매장 통합 관리</h1><p class="text-sm text-slate-500 mb-6">발급받은 아이디로 로그인하세요</p><label class="lb">아이디<input id="lu" class="in" autocomplete="username" autocapitalize="off"></label><label class="lb">비밀번호<input id="lp" type="password" class="in" autocomplete="current-password"></label><p id="le" class="text-sm text-red-700 mb-2">${msg || ''}</p><button class="btn" id="lb">로그인</button>${API ? '' : '<p class="text-xs text-slate-500 mt-4">데모: admin / 1234 (관리자), staff / 1234 (직원)</p>'}</div></div>`;
  $('#lb').onclick = doLogin;
  $('#lp').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
  $('#lu').onkeydown = e => { if (e.key === 'Enter') $('#lp').focus(); };
}
async function doLogin() {
  const username = $('#lu').value.trim(), password = $('#lp').value;
  if (!username || !password) return $('#le').textContent = '아이디와 비밀번호를 입력하세요';
  $('#lb').disabled = true;
  const r = await api('login', { username, password });
  $('#lb').disabled = false;
  if (!r.ok) return $('#le').textContent = r.error || '로그인 실패';
  localStorage.token = r.token; localStorage.user = JSON.stringify(r.user); U = r.user;
  startApp();
}
function logout(msg) {
  localStorage.removeItem('token'); localStorage.removeItem('user');
  U = null; admin = false; me = ''; D = {}; closeSh(); showLogin(typeof msg === 'string' ? msg : '');
}
async function startApp() {
  admin = U.role === 'admin'; me = U.name; $('#lg').innerHTML = '';
  $('#v').innerHTML = empty('불러오는 중…');
  const d = await api('all');
  if (!d.Work) { if (d.auth !== false) $('#v').innerHTML = empty(esc(d.error || '데이터를 불러오지 못했습니다. API 주소를 확인하세요.')); return; }
  D = d; render();
}
function userForm() {
  sheetUI(`<h3 class="font-bold mb-1">계정 추가 / 비밀번호 변경</h3><p class="text-xs text-slate-500 mb-3">이미 있는 아이디를 입력하면 비밀번호와 정보가 바뀝니다. 이름은 직원 목록의 이름과 똑같이 적어야 개인 스케줄이 연결됩니다.</p><label class="lb">아이디 (영문/숫자)<input id="au" class="in" autocapitalize="off"></label><label class="lb">비밀번호 (6자 이상)<input id="ap" class="in"></label><label class="lb">이름<input id="an" class="in"></label><label class="lb">권한<select id="ar" class="in"><option value="staff">직원</option><option value="admin">관리자</option></select></label><button class="btn" id="asv">저장</button><button class="btn s" onclick="closeSh()">닫기</button>`);
  $('#asv').onclick = async () => {
    const r = await api('user', { username: $('#au').value.trim(), password: $('#ap').value, name: $('#an').value.trim(), role: $('#ar').value });
    if (r.ok) { closeSh(); toast('계정을 저장했습니다'); } else toast(r.error || '저장 실패');
  };
}

/* ===== 화면 ===== */
const V = {
  manual() {
    const cs = ['전체', ...catList()];
    const list = D.Manual.filter(m => mcat === '전체' || m.cat === mcat);
    return `<div class="flex gap-2 overflow-x-auto pb-2">${cs.map((c, i) => `<button class="chip ${c === mcat ? '!bg-slate-900 text-white' : ''}" style="padding:6px 14px;flex:none" onclick="setCat(${i})">${esc(c)}</button>`).join('')}${admin ? '<button class="chip" style="padding:6px 14px;flex:none;background:#fde68a" onclick="catMgr()">⚙ 카테고리 관리</button>' : ''}</div>`
      + (list.map(m => `<div class="card" style="--c:var(--ac)" ${admin ? `onclick="openF('Manual','${m.id}')"` : ''}><span class="chip">${esc(m.cat)}</span><h3 class="font-bold text-base my-1">${esc(m.title)}</h3>${m.image ? `<img src="${esc(m.image)}" class="rounded-lg my-2 w-full">` : ''}<p class="whitespace-pre-line text-sm leading-relaxed">${esc(m.content)}</p></div>`).join('') || empty('등록된 매뉴얼이 없습니다')) + fab('Manual');
  },
  work() {
    const all = [...D.Work].sort(byDate);
    const pin = all.filter(r => r.cat === '공지사항').slice(0, 2), rest = all.filter(r => !pin.includes(r));
    const col = { 미완료: '#c2410c', 공유: '#0369a1', 완료: '#15803d' };
    const card = (r, p) => `<div class="card" style="--c:${p ? '#d97706' : col[r.status] || '#cbd5e1'};${p ? 'background:#fffbeb' : ''}" onclick="openF('Work','${r.id}')"><div class="flex gap-3"><div class="flex-1 min-w-0"><div class="flex justify-between items-center text-xs text-slate-500"><span>${r.date} · ${esc(r.author)}</span><button class="chip" style="background:${col[r.status] || '#e2e8f0'}22;color:${col[r.status]}" onclick="event.stopPropagation();cycle('${r.id}')">${esc(r.status)}</button></div><div class="mt-1"><span class="chip mr-1">${p ? '📌 ' : ''}${esc(r.cat)}</span>${esc(r.content)}</div>${r.note ? `<div class="text-xs text-slate-500 mt-1">비고: ${esc(r.note)}</div>` : ''}</div>${thumb('Work', r)}</div></div>`;
    return pin.map(r => card(r, 1)).join('') + rest.map(r => card(r)).join('') + (all.length ? '' : empty('공유된 업무가 없습니다')) + fab('Work');
  },
  meal() { return D.Meal.sort(byDate).map(r => `<button class="card" style="--c:#0f766e" onclick="openF('Meal','${r.id}')"><div class="flex gap-3"><div class="flex-1 min-w-0"><div class="text-xs text-slate-500">${r.date} (${DOW[new Date(r.date + 'T00:00').getDay()]}) · 담당 ${esc(r.owner)}</div><div class="font-bold">${esc(r.menu)}</div>${r.note ? `<div class="text-xs text-slate-500">${esc(r.note)}</div>` : ''}</div>${thumb('Meal', r)}</div></button>`).join('') || empty('등록된 직원식이 없습니다') + '' ; },
  lost() {
    const l = [...D.Lost].sort((a, b) => (a.returned ? 1 : 0) - (b.returned ? 1 : 0) || byDate(a, b));
    return l.map(r => `<div class="card flex items-center gap-3" style="--c:${r.returned ? '#15803d' : '#c2410c'}"><input type="checkbox" class="w-6 h-6" ${r.returned ? 'checked' : ''} onchange="toggleLost('${r.id}')"><div class="flex-1" onclick="openF('Lost','${r.id}')"><div class="text-xs text-slate-500">${r.date} · ${esc(r.author)}</div><div class="${r.returned ? 'line-through text-slate-400' : ''}">${esc(r.content)}</div></div><span class="chip">${r.returned ? '반환 완료' : '미반환'}</span>${thumb('Lost', r)}</div>`).join('') || empty('등록된 분실물이 없습니다');
  },
  disc() {
    const m = today.slice(0, 7), sum = D.Discount.filter(r => r.date.startsWith(m)).reduce((a, r) => a + +r.amount, 0);
    return `<div class="card" style="--c:var(--ac)"><div class="text-xs text-slate-500">이번 달 할인 합계</div><div class="text-2xl font-bold">${sum.toLocaleString()}원</div></div>`
      + [...D.Discount].sort(byDate).map(r => `<button class="card" onclick="openF('Discount','${r.id}')"><div class="flex justify-between"><b>${esc(r.name)} <span class="chip">${esc(r.dept)}</span></b><b>${(+r.amount).toLocaleString()}원</b></div><div class="text-xs text-slate-500">${r.date}${r.note ? ' · ' + esc(r.note) : ''}</div></button>`).join('') + fab('Discount');
  },
  resv() {
    const y = cal.getFullYear(), m = cal.getMonth(), n = new Date(y, m + 1, 0).getDate();
    let c = '<div></div>'.repeat(cal.getDay());
    for (let d = 1; d <= n; d++) {
      const ds = ymd(new Date(y, m, d)), rs = D.Reservation.filter(r => r.date === ds);
      c += `<button onclick="dayView('${ds}')" class="h-[68px] rounded-lg p-1 text-left bg-white ${ds === today ? 'ring-2 ring-teal-600' : ''}"><div class="text-xs ${rs.length ? 'font-bold' : 'text-slate-500'}">${d}</div>${rs.length ? `<div class="text-[10px] leading-tight text-teal-800 line-clamp-2">${esc(rs[0].content)}</div>${rs.length > 1 ? `<div class="text-[10px]">+${rs.length - 1}</div>` : ''}` : ''}</button>`;
    }
    return `<div class="flex justify-between items-center mb-2"><button class="chip" style="padding:8px 14px" onclick="cal.setMonth(cal.getMonth()-1);render()">◀</button><b>${y}년 ${m + 1}월</b><button class="chip" style="padding:8px 14px" onclick="cal.setMonth(cal.getMonth()+1);render()">▶</button></div><div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 mb-1">${DOW.map(d => `<div>${d}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">${c}</div>`;
  },
  sched() {
    const seg = admin ? `<div class="seg flex gap-2 mb-3"><button class="${smode === 'me' ? 'on' : ''}" onclick="smode='me';render()">내 스케줄</button><button class="${smode === 'all' ? 'on' : ''}" onclick="smode='all';render()">전체 스케줄</button></div>` : '';
    const mon = monday(wk), days = [...Array(7)].map((_, i) => { const x = new Date(mon); x.setDate(x.getDate() + i); return x; });
    const nav = `<div class="flex justify-between items-center mb-3"><button class="chip" style="padding:8px 14px" onclick="wk--;render()">◀</button><b class="text-sm">${ymd(days[0]).slice(5)} ~ ${ymd(days[6]).slice(5)}${wk === 0 ? ' (이번 주)' : ''}</b><button class="chip" style="padding:8px 14px" onclick="wk++;render()">▶</button></div>`;
    const shift = (n, d) => D.Schedule.find(s => s.name === n && s.date === d);
    if (smode === 'all' && admin) {
      const rows = D.Staff.map(p => { let t = 0; const tds = days.map(d => { const s = shift(p.name, ymd(d)); if (s) t += hrs(s); return `<td onclick="editShift('${p.id}','${ymd(d)}')">${s ? s.start.slice(0, 5) + '<br>' + s.end.slice(0, 5) : '<span class="text-slate-300">+</span>'}</td>`; }).join(''); return `<tr><td onclick="openF('Staff','${p.id}')"><b>${esc(p.name)}</b><br><span class="text-slate-500">${esc(p.role)}·${esc(p.position)}</span></td>${tds}<td><b>${t}h</b></td></tr>`; }).join('');
      return seg + nav + `<div class="overflow-x-auto bg-white rounded-xl"><table class="w-full"><tr><th>직원</th>${days.map(d => `<th>${d.getMonth() + 1}/${d.getDate()}<br>${DOW[d.getDay()]}</th>`).join('')}<th>합계</th></tr>${rows}</table></div><button class="btn mt-3" onclick="openF('Staff',null)">+ 직원 추가 (보건증·대휴 포함)</button><button class="btn s" onclick="userForm()">🔑 계정 추가 / 비밀번호 변경</button><p class="text-xs text-slate-500 mt-2">칸을 누르면 출퇴근 시간을 수정, 이름을 누르면 직원 정보를 수정합니다.</p>`;
    }
    const p = D.Staff.find(s => s.name === me);
    const pick = !admin ? '' : `<select class="in" onchange="me=this.value;render()"><option value="">이름을 선택하세요</option>${D.Staff.map(s => `<option ${s.name === me ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`;
    if (!p) return seg + pick + empty(admin ? '이름을 선택하면 이번 주 근무가 보입니다' : '내 이름(' + esc(me) + ')이 직원 목록에 없습니다. 관리자에게 문의하세요.');
    const dd = p.hcExpire ? Math.ceil((new Date(p.hcExpire + 'T00:00') - new Date(today + 'T00:00')) / 864e5) : null;
    const hc = dd === null ? '' : dd < 0 ? `<div class="card" style="--c:#b91c1c;background:#fef2f2">🩺 보건증이 ${-dd}일 전에 만료되었습니다. 갱신해 주세요.</div>` : dd <= 30 ? `<div class="card" style="--c:#d97706;background:#fffbeb">🩺 보건증 만료 <b>D-${dd}</b> (${p.hcExpire})</div>` : `<div class="card text-sm" style="--c:#15803d">🩺 보건증 만료일 ${p.hcExpire} (D-${dd})</div>`;
    let tot = 0;
    const cards = days.map(d => { const s = shift(me, ymd(d)); if (!s) return ''; const h = hrs(s); tot += h; return `<div class="card flex justify-between items-center" style="--c:${ymd(d) === today ? 'var(--ac)' : '#cbd5e1'}"><div><b>${d.getMonth() + 1}/${d.getDate()} (${DOW[d.getDay()]})</b><div class="text-xs text-slate-500">${esc(p.position)}</div></div><div class="text-right"><div class="font-bold">${s.start} ~ ${s.end}</div><div class="text-xs text-slate-500">${h}시간</div></div></div>`; }).join('');
    return seg + pick + '<div class="h-3"></div>' + hc + nav + (cards || empty('이번 주 근무가 없습니다')) + `<div class="card" style="--c:var(--ink)"><b>주간 총 ${tot}시간</b><span class="text-xs text-slate-500 ml-2">대휴 잔여 ${esc(p.daeHyu || 0)}일${p.daeHyuUsed ? ' · 최근 사용 ' + p.daeHyuUsed : ''}</span></div>`;
  }
};
V.meal = (f => () => f() + fab('Meal'))(V.meal);
V.lost = (f => () => f() + fab('Lost'))(V.lost);
V.resv = (f => () => f())(V.resv);

const monday = off => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7); return d; };
const hrs = s => { if (!s.start || !s.end) return 0; const [a, b] = s.start.split(':'), [c, d] = s.end.split(':'); let m = (+c * 60 + +d) - (+a * 60 + +b); if (m < 0) m += 1440; return Math.round(m / 6) / 10; };
function cycle(id) { const r = D.Work.find(x => x.id == id), o = ['미완료', '공유', '완료']; save('Work', { ...r, status: o[(o.indexOf(r.status) + 1) % 3] }); }
function toggleLost(id) { const r = D.Lost.find(x => x.id == id); save('Lost', { ...r, returned: r.returned ? '' : 'Y' }); }
function editShift(sid, date) { const name = D.Staff.find(x => x.id == sid).name; const r = D.Schedule.find(s => s.name === name && s.date === date) || { name, date }; showForm('Schedule', F.Schedule, r, `${name} · ${date}`); }
function dayView(ds) {
  const rs = D.Reservation.filter(r => r.date === ds);
  sheetUI(`<h3 class="font-bold mb-3">${ds} (${DOW[new Date(ds + 'T00:00').getDay()]})</h3>${rs.map(r => `<div class="card" style="--c:var(--ac)" onclick="openF('Reservation','${r.id}')">${esc(r.content)}</div>`).join('') || '<p class="text-slate-500 mb-3">예약이 없습니다</p>'}<button class="btn" onclick="showForm('Reservation',F.Reservation,{date:'${ds}'},'예약 등록')">+ 예약 추가</button><button class="btn s" onclick="closeSh()">닫기</button>`);
}

/* ===== 라우팅 ===== */
const T = [['manual', '📖', '매뉴얼'], ['work', '📢', '업무공유'], ['sched', '📅', '스케줄'], ['meal', '🍱', '직원식'], ['lost', '📦', '분실물'], ['disc', '💳', '할인'], ['resv', '🗓️', '예약']];
function render() {
  $('#nav').innerHTML = T.map(([k, i, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="tab='${k}';render();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join('');
  $('#ttl').textContent = T.find(t => t[0] === tab)[2];
  $('#adm').textContent = (admin ? '관리자 ' : '') + U.name + ' · 로그아웃';
  $('#v').innerHTML = V[tab]();
}
U ? startApp() : showLogin();
</script>
</body>
</html>
